# OWASAKA — Secrets template
#
# This is the plaintext template. It is the SHAPE of `secrets.yaml`
# (encrypted, committed) without any real values. Copy this file to
# `secrets.yaml`, fill in real values, then encrypt with:
#
#   sops --encrypt --in-place secrets.yaml
#
# `secrets.yaml` (encrypted) is committed; the decrypted version is
# gitignored. See docs/secrets/BOOTSTRAP.md.

# --- NATS / Spectre event bus ----------------------------------------------
# Used by internal/events/publisher.go when connecting to the NATS instance
# routed by Spectre. mTLS preferred over user/pass; user/pass kept here for
# environments where mTLS bootstrap isn't yet possible.
nats:
  url: "nats://localhost:4222"
  user: ""
  password: ""

# --- Internal Identity (ADR-0059) ------------------------------------------
# Used by internal/identity/* during bootstrap. The values below are only
# *defaults* — runtime operations (key rotation, principal creation) generate
# their own material via internal/storage/pki.
identity:
  # Dev-mode static token. ONLY honored when OSWAKA_ENV=development.
  # See ADR-0059 §"Dev-mode escape hatch".
  dev_token: ""

  # Optional OIDC (Zitadel) integration — feature-flagged, default off.
  # See ADR-0059 §"OIDC provider preference" (Zitadel).
  oidc:
    issuer_url: ""
    client_id: ""
    client_secret: ""

# --- NAS / Storage ---------------------------------------------------------
# Used by internal/storage/nas when connecting to the air-gapped NAS cluster.
nas:
  username: ""
  password: ""

# --- Encryption at rest ----------------------------------------------------
# Master key for AES-256-GCM data encryption (internal/storage/crypto).
# 32 random bytes, base64-encoded.
encryption:
  master_key_b64: ""

# --- TLS material (optional) -----------------------------------------------
# If running with TLS termination at the binary level (rather than via a
# reverse proxy), paste PEM-encoded blobs here.
tls:
  cert_pem: ""
  key_pem: ""

# --- Legacy Wazuh stack (DEPRECATED) ---------------------------------------
# Wazuh containers are scheduled for removal once OWASAKA fully supersedes
# them. Kept here only so existing `docker-compose.yml` references resolve.
# DO NOT add new consumers.
legacy_wazuh:
  indexer_username: ""
  indexer_password: ""
  api_username: ""
  api_password: ""
