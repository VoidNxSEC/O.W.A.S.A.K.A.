# O.W.A.S.A.K.A. — Hyprland integration
# Source from your hyprland.conf:
#   source = ~/.config/hypr/conf.d/owasaka.conf
#
# Environment: set OSWAKA_HOST and OSWAKA_TOKEN before sourcing,
# or hardcode below. Token is read from $OSWAKA_TOKEN at exec time.

# ── Startup daemons ─────────────────────────────────────────────────────────

# Waybar module: live event/alert/chain counts in status bar
exec-once = owasaka-bar --host localhost:8080

# Desktop notifications: CRITICAL/HIGH alerts via SwayNC
exec-once = owasaka-notify --host localhost:8080

# ── Workspace 9 — SIEM Command Center ────────────────────────────────────────

# Pin workspace 9 to your primary monitor, always persistent
workspace = 9, monitor:desc:, persistent:true, defaultName:SIEM

# Open the web UI (Firefox) on workspace 9 at login
exec-once = [workspace 9 silent] firefox --new-window http://localhost:8080

# Window rules: keep OWASAKA browser tab on workspace 9
windowrulev2 = workspace 9,   class:^(firefox)$, title:^(O\.W\.A\.S\.A\.K\.A\.)(.*)$
windowrulev2 = float,         class:^(firefox)$, title:^(O\.W\.A\.S\.A\.K\.A\.)(.*)$
windowrulev2 = size 1400 900, class:^(firefox)$, title:^(O\.W\.A\.S\.A\.K\.A\.)(.*)$
windowrulev2 = center,        class:^(firefox)$, title:^(O\.W\.A\.S\.A\.K\.A\.)(.*)$

# Analyst scratchpad: toggled terminal for analyst shell
# nix develop .#analyst (RAM scratchpad + printer)
windowrulev2 = float,         class:^(owasaka-analyst)$
windowrulev2 = size 1100 700, class:^(owasaka-analyst)$
windowrulev2 = center,        class:^(owasaka-analyst)$
windowrulev2 = animation slide bottom, class:^(owasaka-analyst)$

# ── Keybindings ──────────────────────────────────────────────────────────────

# Super+Alt+S → SIEM workspace (Command Center)
bind = SUPER ALT, S, workspace, 9

# Super+Alt+A → rofi alert triage
bind = SUPER ALT, A, exec, owasaka-triage

# Super+Alt+N → toggle SwayNC notification center
bind = SUPER ALT, N, exec, swaync-client -t

# Super+Alt+X → seal-host prompt (rofi one-liner, fires containment API)
bind = SUPER ALT, X, exec, owasaka-seal

# Super+Alt+T → open analyst terminal scratchpad (nix develop .#analyst)
bind = SUPER ALT, T, exec, [float; class:owasaka-analyst] foot --app-id owasaka-analyst --working-directory /tmp -e sh -c "cd ${OWASAKA_DIR:-$HOME} && nix develop $(dirname $(which owasaka-bar) 2>/dev/null | sed 's|/bin$||' || echo '.')#analyst"

# Super+Alt+L → show last 20 events in a floating terminal
bind = SUPER ALT, L, exec, [float; size 900 500; center] foot -e sh -c "curl -s -H 'Authorization: Bearer $OSWAKA_TOKEN' http://localhost:8080/api/events?limit=20 | jq -C '.' | less -R"
